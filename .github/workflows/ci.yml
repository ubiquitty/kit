name: CI

# The full matrix, on every pull request and every push to main: the batteries
# Libraries/ubiquitty-core/Scripts/ci_batteries.py defines, run over the Kit
# with the Core it pins; the push gates Scripts/pre-push-gates.sh runs (the same
# families, through the same runner, with every diff-chosen gate selected and
# every stand-down a failure); the Kit's Linux libraries, renderer drivers and
# public framework consumers. Core tests its engine; the app tests its pinned
# Kit and Core together through its own frontends.
#
# One required check, `CI`, needs every other job, so the list of jobs can
# change without a change to the repository's branch protection.
#
# A newer push to a pull request supersedes its run. main is exempt: every merge
# there is a commit that nothing else will re-verify, and a cancelled run would
# leave it without a verdict, which is what bisecting a regression across three
# repositories needs. Scheduled sweeps have a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'sweep' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      ui_scenarios:
        description: "Also run the app's macOS UI scenarios in the app job"
        type: boolean
        default: false
  # Once a day: a sweep stands down when main's tip already has a verdict.
  schedule:
    - cron: "53 5 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# GitHub-hosted runners only. Repository settings must keep self-hosted runners
# unregistered: a pull request can supply its own workflow file.
env:
  UBQ_CI_ANNOTATE: "1"

# Every job reads the checkout and nothing else. Preflight adds the two reads
# ci_reach.py needs, and the jobs that build the app add none: the app is
# public, and the pairing is read through the same token.
permissions:
  contents: read


jobs:
  preflight:
    # Draft events still enter workflow concurrency to cancel prior ready runs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      builds: ${{ steps.reach.outputs.builds }}
      linux: ${{ steps.reach.outputs.linux }}
      apple: ${{ steps.reach.outputs.apple }}
      cmake: ${{ steps.reach.outputs.cmake }}
      code: ${{ steps.reach.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Determine change reach and completed checkpoints
        id: reach
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Libraries/ubiquitty-core/Scripts/ci_reach.py --source-root "$GITHUB_WORKSPACE"
      # A sweep that stands down runs no gate, so it concludes as the run that
      # judged this tip did: a failed tip stays red, and the next sweep reads
      # this run's failure as the same verdict rather than its skips as a pass.
      - name: Keep this tip's failed verdict
        if: steps.reach.outputs.standing == 'failure'
        run: |
          echo "::error title=CI reach::An earlier run of this commit failed a gate; this sweep did not run it again"
          exit 1
      - name: Name the CI image
        id: image
        if: runner.environment == 'github-hosted' && steps.reach.outputs.preflight != 'false'
        run: echo "digest=$(./Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        if: steps.image.outputs.digest != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast preflight
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
        run: ./Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py run preflight --source-root "$GITHUB_WORKSPACE"
      # The commit rules the push hook runs and the preflight battery does not,
      # through the hook's own runner. Strict: a gate that stands down fails.
      - name: Push gates (commit rules)
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: core_gate_commit_rules
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: ./Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" ./Scripts/pre-push-gates.sh
      - name: Save the CI image
        if: always() && steps.image.outputs.digest != '' && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Report completed, failed, and unexecuted preflight stages
        if: always() && steps.reach.outputs.preflight != 'false'
        run: python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py report preflight --source-root "$GITHUB_WORKSPACE"
      # A failed stage's log, in full, in the job log. CI uploads no artifacts: the
      # job log is where a failure is read.
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/preflight"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done

  linux:
    name: Linux battery
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Name the CI image
        id: image
        run: echo "digest=$(./Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast Linux battery
        id: battery
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: "true"
          UBQ_BUILD_ROOT: ${{ runner.workspace }}/build-kit
        run: ./Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py run linux --source-root "$GITHUB_WORKSPACE"
      - name: Save the CI image
        if: always() && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}

      - name: Full Linux battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Linux code stage reached its verdict"
      - name: Report completed, failed, and unexecuted Linux stages
        if: always()
        run: python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py report linux --source-root "$GITHUB_WORKSPACE"
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/linux"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done

  apple:
    name: Apple battery
    needs: preflight
    if: needs.preflight.outputs.apple == 'true'
    # GitHub's image with the Xcode this tree builds with (27.1, as the
    # maintainers' Macs have it); see .github/actionlint.yml.
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      # A job's env cannot read the runner context, so this step sets the cache
      # beside the checkout and names the build root from the runner's own
      # variables; every later step reads them.
      - name: Compiler cache and build root
        id: roots
        run: |
          command -v ccache >/dev/null 2>&1 || brew install ccache
          {
            echo "CCACHE_DIR=$RUNNER_WORKSPACE/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
          echo "build=$(python3 Libraries/ubiquitty-core/Scripts/build_root.py .)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-apple-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-apple-
      - name: Cache QUIC dependencies
        if: needs.preflight.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ steps.roots.outputs.build }}/quic-deps/lib
            ${{ steps.roots.outputs.build }}/quic-deps/include
          key: quic-deps-${{ runner.os }}-${{ hashFiles('Libraries/ubiquitty-core/Scripts/fetch-quic-deps.sh') }}
      # The Swift renderer's drivers and the iOS simulator arm are stages of
      # this battery, beside the whole suite.
      - name: Run the fail-fast Apple battery
        id: battery
        run: python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py run apple --source-root "$GITHUB_WORKSPACE"
      # What the push hook runs on a Mac and the battery does not: the Swift
      # renderer compiled from clean, the framework's external consumer (an app
      # that links the built UbiquittyKit.framework and opens windows on the
      # runner's window server), and the style checks whose self-tests read the
      # built test objects.
      - name: Push gates (macOS)
        env:
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: kit_gate_apple core_gate_style_checks
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: ./Scripts/pre-push-gates.sh
      - name: Full Apple battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Apple code stage reached its verdict"
      - name: Report completed, failed, and unexecuted Apple stages
        if: always()
        run: python3 Libraries/ubiquitty-core/Scripts/ci_batteries.py report apple --source-root "$GITHUB_WORKSPACE"
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/apple"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-apple-${{ github.run_id }}-${{ github.run_attempt }}

  ci:
    name: CI
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [preflight, linux, apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for job, result in sorted(needs.items()):
              conclusion = result["result"]
              print(f"{job}: {conclusion}")
              if job == "preflight" and conclusion != "success":
                  failed.append(job)
              elif conclusion not in ("success", "skipped"):
                  failed.append(job)
          if failed:
              print(f"::error title=CI::did not pass: {', '.join(failed)}")
              sys.exit(1)
          EOF
